name: news-ledger-staging

services:
  app:
    image: ${IMAGE_REF:?IMAGE_REF must be the staged immutable image ID}
    container_name: news-ledger-staging
    restart: unless-stopped
    network_mode: bridge
    environment:
      NODE_ENV: staging
      PORT: "8080"
      DATA_SOURCE: production
      LEDGER_DB_PATH: /data/news-ledger.db
      LEDGER_READ_ONLY: "true"
    ports:
      - "${HOST_BIND_ADDRESS:-192.168.0.245}:18111:8080"
    volumes:
      - production-data:/data:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 5s

  collector:
    image: ${IMAGE_REF:?IMAGE_REF must be the staged immutable image ID}
    container_name: news-ledger-collector
    restart: unless-stopped
    network_mode: bridge
    command: ["node", "src/cli.mjs", "loop"]
    environment:
      NODE_ENV: production
      DATA_SOURCE: production
      LEDGER_DB_PATH: /data/news-ledger.db
      COLLECT_INTERVAL_MS: "${COLLECT_INTERVAL_MS:-900000}"
    volumes:
      - production-data:/data

volumes:
  production-data:
    external: true
    name: ${NEWS_LEDGER_PRODUCTION_DATA_VOLUME:-news-ledger-production-data}

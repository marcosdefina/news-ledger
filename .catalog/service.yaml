apiVersion: catalog.stillwaters.cz/v1alpha1
kind: Service
metadata:
  name: news-ledger
  displayName: News Ledger
  description: Provenance-first public record of news articles, revisions,
    reception, and evidence-backed classifications.
  owner: marcosdefina
spec:
  repository:
    provider: github
    owner: marcosdefina
    name: news-ledger
    visibility: private
    branches:
      development: develop
      staging: staging
      production: master
  documentation:
    confluence:
      enabled: true
      spaceKey: NEWS
    vault:
      enabled: true
      collectionId: project-docs
  scaffold:
    profile: node-http
  runtime:
    kind: docker
    host: mainframe
    containerPort: 8080
    healthPath: /health
  environments:
    staging:
      branch: staging
      hostname: staging.news.stillwaters.cz
      port: 18111
      dataSource: production
    production:
      branch: master
      hostname: news.stillwaters.cz
      port: 18110
  delivery:
    artifact: docker-image-digest
    promotion: exact-staged-artifact
    productionApproval: after-staging-verification
    jenkins:
      enabled: true
      credentialsId: github-http-read
      receiptSigningCredentialId: catalog-receipt-hmac
      agentLabel: mainframe
      controllerContainer: jenkins
      composeHelperImage: docker:28.5.1-cli@sha256:a35dae37a79d2b84ccf0100045aec5ab920e4cc8e84f9141d355da602f8af899
      productionApprovers:
        - admin
  gateway:
    enabled: true
    host: gateway
    tls: letsencrypt
  dashboard:
    enabled: true
    icon: newspaper
  context:
    providers:
      - claude-code
      - codex
      - github-copilot
